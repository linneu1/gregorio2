<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Floresta Mágica — um jogo criado por Gregório do 1º ano.">
  <title>Floresta Mágica — Gregório</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-page">

    <header class="game-header">
      <div>
        <h1>🌳 Floresta Mágica</h1>
        <p>Uma aventura criada por Gregório • 1º ano</p>
      </div>

      <button id="fullscreenBtn" class="top-button">
        ⛶ Tela cheia
      </button>
    </header>

    <section class="game-container">

      <div class="hud">

        <div class="hud-item">
          <span>❤️ VIDA</span>
          <div class="bar">
            <div id="healthBar" class="health"></div>
          </div>
          <strong id="healthText">100</strong>
        </div>

        <div class="enemy-info">
          <span id="enemyCounter">INIMIGO 1 / 3</span>
          <strong id="enemyName">Goblin da Mata</strong>
        </div>

      </div>

      <div class="canvas-wrapper">
        <canvas
          id="gameCanvas"
          width="960"
          height="540">
        </canvas>

        <div id="gameMessage" class="game-message">
          Derrote o inimigo!
        </div>
      </div>

      <div class="powers">

        <button class="power active" data-element="fire">
          <span>🔥</span>
          <small>1</small>
          Fogo
        </button>

        <button class="power" data-element="water">
          <span>🌊</span>
          <small>2</small>
          Água
        </button>

        <button class="power" data-element="air">
          <span>🌪️</span>
          <small>3</small>
          Ar
        </button>

        <button class="power" data-element="earth">
          <span>🌱</span>
          <small>4</small>
          Terra
        </button>

        <button id="meteorButton" class="power meteor" disabled>
          <span>☄️</span>
          <small>M</small>
          Meteoro
        </button>

      </div>

      <div class="mobile-controls">

        <div class="dpad">
          <button data-key="ArrowUp">▲</button>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>

        <button id="attackButton" class="attack-button">
          ⚔️<br>
          ATACAR
        </button>

      </div>

      <div class="instructions">
        <span>WASD / SETAS</span>
        <span>•</span>
        <span>MOUSE = MIRAR</span>
        <span>•</span>
        <span>CLIQUE / ESPAÇO = ATACAR</span>
        <span>•</span>
        <span>R = RECOMEÇAR</span>
      </div>

      <button id="restartButton" class="restart-button">
        🔄 Recomeçar aventura
      </button>

    </section>

    <footer>
      <p>🌳 Floresta Mágica</p>
      <p>Jogo criado por <strong>Gregório — 1º ano</strong></p>
    </footer>

  </main>

  <script src="game.js"></script>

</body>
</html>
